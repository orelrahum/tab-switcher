<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e; color: #e0e0e0;
    }
    h3 {
      font-size: 13px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid transparent; margin-bottom: 6px;
      transition: background .1s, border-color .1s;
    }
    .option:hover { background: #2a2a2a; }
    .option.active { background: #1a2a3a; border-color: #0078d4; }
    .option input[type="radio"] {
      accent-color: #0078d4; margin-top: 2px; flex-shrink: 0;
    }
    .option-text { display: flex; flex-direction: column; gap: 2px; }
    .option-label { font-size: 13px; color: #e0e0e0; font-weight: 500; }
    .option.active .option-label { color: #fff; }
    .option-desc { font-size: 11px; color: #777; line-height: 1.4; }
    #saved {
      color: #4caf50; font-size: 12px; text-align: center;
      margin-top: 10px; opacity: 0; transition: opacity .3s;
    }
  </style>
</head>
<body>
  <h3>Tab Order</h3>

  <label class="option" data-value="recent">
    <input type="radio" name="sort" value="recent">
    <div class="option-text">
      <div class="option-label">Recently focused</div>
      <div class="option-desc">Tabs you used last appear first (Alt+Tab style).</div>
    </div>
  </label>

  <label class="option" data-value="tab-bar">
    <input type="radio" name="sort" value="tab-bar">
    <div class="option-text">
      <div class="option-label">Tab bar order</div>
      <div class="option-desc">Same order as your browser tab bar / vertical tabs.</div>
    </div>
  </label>

  <div id="saved">✓ Saved</div>

  <script src="options.js"></script>
</body>
</html>
