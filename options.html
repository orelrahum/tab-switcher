<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a; color: #e0e0e0;
    }
    h3 { margin: 0 0 14px; font-size: 14px; color: #fff; }
    label {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; cursor: pointer; font-size: 13px;
    }
    input[type="radio"] { accent-color: #0078d4; }
    .desc { font-size: 11px; color: #777; margin: -4px 0 10px 24px; }
    #saved {
      color: #4caf50; font-size: 12px; margin-top: 12px;
      opacity: 0; transition: opacity .3s;
    }
  </style>
</head>
<body>
  <h3>Tab Order</h3>

  <label>
    <input type="radio" name="sort" value="recent">
    Recently focused
  </label>
  <div class="desc">Tabs you used last appear first (Alt+Tab style).</div>

  <label>
    <input type="radio" name="sort" value="tab-bar">
    Tab bar order
  </label>
  <div class="desc">Same order as your browser tab bar / vertical tabs.</div>

  <div id="saved">✓ Saved</div>

  <script src="options.js"></script>
</body>
</html>
